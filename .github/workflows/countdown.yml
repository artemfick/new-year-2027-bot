name: New Year countdown

on:
  schedule:
    # Время в cron — UTC (МСК = UTC+3). Запуск заранее, скрипт сам ждёт точного времени.
    - cron: "25 20 * * *"    # каждый день 23:25 МСК → ждёт 00:00 МСК, шлёт стикер дня
    - cron: "30 16 31 12 *"  # 31 дек 19:30 МСК → ждёт 20:00 МСК, «С наступающим»
    - cron: "20 19 31 12 *"  # 31 дек 22:20 МСК → ждёт 00:00 по Тольятти (23:00 МСК)
  workflow_dispatch:         # ручной запуск для проверки (отправляет сразу)
    inputs:
      mode:
        description: "Что отправить"
        type: choice
        default: countdown
        options: [countdown, eve, togliatti, moscow]

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pick mode
        id: pick
        run: |
          case "${{ github.event.schedule }}" in
            "30 16 31 12 *") m=eve ;;
            "20 19 31 12 *") m=togliatti ;;
            "25 20 * * *")   m=countdown ;;
            *)               m="${{ inputs.mode }}" ;;
          esac
          echo "mode=$m" >> "$GITHUB_OUTPUT"
      - name: Send
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_IDS: ${{ secrets.CHAT_IDS }}
          STICKER_SET: ${{ vars.STICKER_SET }}
          MANUAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}
        run: python bot.py ${{ steps.pick.outputs.mode }}
